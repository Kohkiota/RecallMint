onlyBuiltDependencies:
  - bufferutil
  - utf-8-validate

overrides:
  uuid: ^14.0.0
  # GHSA-6g55-p6wh-862q 対処(postcss <=8.5.11 = sourceMappingURL 経由の任意ファイル
  # 読取)。caret は patched を許容するが lockfile が @tailwindcss/postcss + shadcn 経由で
  # 8.5.10 に stale pin(pnpm は range 内の古い lock を install で bump しない)→ floor を
  # ^8.5.12 に上げ再解決を強制(8.5.21 に単一化)。撤去条件 = 全消費側が >=8.5.12 を
  # 自然解決した時点。台帳参照。
  postcss: ^8.5.12
  react: 19.2.7
  react-dom: 19.2.7
  # GHSA-fx2h-pf6j-xcff 対処。range 内だが pnpm update が peer-suffix 付き
  # transitive を更新しないため override で固定(撤去条件 = 台帳「解消済」参照)
  vite: 8.0.16
  # GHSA-f88m-g3jw-g9cj(sharp <0.35.0 = libvips 継承脆弱性)対処。sharp は next の
  # optionalDependencies(^0.34.5)由来 transitive で、next 16.2.11 も optional 範囲が
  # ^0.34.5 のままゆえ next bump では 0.34.5 に留まる → override で patched 化。
  # 撤去条件 = next の optionalDependencies.sharp が >=0.35.0 に上がった時点。台帳参照。
  sharp: ^0.35.0

# audit gate の受容 allow-list。用途 = patched 不在 or 理由ある真の受容のみ
# (bump 可能な検出は受容せず台帳「bump 待ち」へ)。追加時は GHSA/CVE・理由・
# 再検討条件を docs/audit/dependency-audit-ledger.md にセットで記録する。
auditConfig:
  # GHSA-mh99-v99m-4gvg(CVE-2026-14257・High・brace-expansion OOM 型 DoS)受容。受容経路 =
  # eslint@9 → minimatch@3 → brace-expansion@1.1.16(**dev 依存のみ**・build/lint 時 tooling)。根拠 =
  # v1 系に patched backport 無し(patched=5.0.8=v5 のみ・1.1.16 が v1 最新で affected)+ 強制 5.0.8 は
  # minimatch@3(CJS default `require()` 期待)を壊す(v5 は named export・実証済)+ glob 入力は repo 管理
  # config 由来で攻撃者制御なし・runtime/client bundle 非混入。v5 線(typescript-estree>minimatch@10)は
  # 5.0.8 に実 patch 済。注意: ignoreGhsas は advisory 単位ゆえ将来 <=5.0.7 が別経路で再導入されても
  # 同 GHSA として沈黙(残余リスク)。撤去条件 = v1 系公式 backport / ESLint 10 移行(v1 線消滅=本行削除)/
  # 新経路で同 GHSA 該当。再検討期限 = 2026-08-22 or deps 再基線 sprint 完了の早い方。台帳参照。
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
