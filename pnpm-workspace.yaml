onlyBuiltDependencies:
  - bufferutil
  - utf-8-validate

overrides:
  # 導入経緯不明・現在ツリー未到達(pnpm why uuid が空・2026-07-26 確認)。次に deps を触る際に撤去可否を判断
  uuid: ^14.0.0
  # GHSA-6g55-p6wh-862q 対処(postcss <=8.5.11 = sourceMappingURL 経由の任意ファイル
  # 読取)。caret は patched を許容するが lockfile が @tailwindcss/postcss + shadcn 経由で
  # 8.5.10 に stale pin(pnpm は range 内の古い lock を install で bump しない)→ floor を
  # ^8.5.12 に上げ再解決を強制(8.5.21 に単一化)。撤去条件 = 全消費側が >=8.5.12 を
  # 自然解決した時点。台帳参照。
  postcss: ^8.5.12
  react: 19.2.7
  react-dom: 19.2.7
  # GHSA-fx2h-pf6j-xcff 対処。range 内だが pnpm update が peer-suffix 付き
  # transitive を更新しないため override で固定(撤去条件 = 台帳「解消済」参照)
  vite: 8.0.16
  # GHSA-f88m-g3jw-g9cj(sharp <0.35.0 = libvips 継承脆弱性)対処。sharp は next の
  # optionalDependencies(^0.34.5)由来 transitive で、next 16.2.11 も optional 範囲が
  # ^0.34.5 のままゆえ next bump では 0.34.5 に留まる → override で patched 化。
  # 撤去条件 = next の optionalDependencies.sharp が >=0.35.0 に上がった時点。台帳参照。
  sharp: ^0.35.0

# audit gate の受容 allow-list は pnpm の auditConfig から scripts/audit-allowlist.json 管理の
# wrapper(scripts/audit-gate.mjs)へ移行済(matrix v2 / 2026-07-25)。この file には auditConfig
# を置かない — 置くと pnpm が wrapper へ渡す前に advisory を沈黙 filter するため。無許可 suppression
# は check-audit-config.mjs の tripwire が検出し続ける(詳細記録は台帳へ・この file には書かない)。
